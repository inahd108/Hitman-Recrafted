plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            if (project.hasProperty('gunshots')) {
                systemProperty 'recrafted.gunshots', project.findProperty('gunshots')
                if (project.hasProperty('gunshotsAt')) systemProperty 'recrafted.gunshots.at', project.findProperty('gunshotsAt')
                if (project.hasProperty('gunshotsGui')) systemProperty 'recrafted.gunshots.gui', 'true'
                ['reload', 'reloadLen', 'inspect', 'inspectLen', 'ammo'].each { k ->
                    def prop = 'gunshots' + k.capitalize()
                    if (project.hasProperty(prop)) systemProperty "recrafted.gunshots.${k}", project.findProperty(prop)
                }
                programArguments.addAll('--quickPlaySingleplayer', project.findProperty('world') ?: 'corvara_test',
                        '--width', '1280', '--height', '720')
            }
            if (project.hasProperty('menushots')) {
                systemProperty 'recrafted.menushots', project.findProperty('menushots')
                ['anchor', 'cam', 'times', 'poses', 'fov', 'distance', 'settle', 'agentYaw', 'agentPitch',
                 'orbitAt', 'orbitCount', 'orbitStart', 'orbitSettle', 'orbitTime', 'orbitFov'].each { k ->
                    def prop = 'menu' + k.capitalize()
                    if (project.hasProperty(prop)) systemProperty "recrafted.menushots.${k}", project.findProperty(prop)
                }
                programArguments.addAll('--quickPlaySingleplayer', project.findProperty('world') ?: 'corvara_test',
                        '--width', '1920', '--height', '1080')
            }
            if (project.hasProperty('menutest')) {
                systemProperty 'recrafted.menutest', 'true'
                if (project.hasProperty('menutestPlay')) systemProperty 'recrafted.menutest.play', 'true'
                programArguments.addAll('--width', '1920', '--height', '1080')
            }
            if (project.hasProperty('guardtest')) {
                systemProperty 'recrafted.guardtest', 'true'
                programArguments.addAll('--quickPlaySingleplayer', project.findProperty('world') ?: 'corvara_test',
                        '--width', '1280', '--height', '720')
            }
            if (project.hasProperty('clienttest')) {
                systemProperty 'recrafted.clienttest', 'true'
                systemProperty 'recrafted.clienttest.settle', project.findProperty('settle') ?: '20000'
                programArguments.addAll('--quickPlaySingleplayer', project.findProperty('world') ?: 'corvara_test',
                        '--width', '1280', '--height', '720')
            }
        }
        server {
            server()
            programArgument '--nogui'
            if (project.hasProperty('selftest')) {
                systemProperty 'recrafted.selftest', 'true'
                systemProperty 'recrafted.selftest.ticks', project.findProperty('selftestTicks') ?: '2400'
            }
        }
        configureEach {
            systemProperty 'forge.logging.console.level', 'info'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // TACZ is optional at runtime for players; the dev client loads it to test the gun pack
    modCompileOnly "maven.modrinth:timeless-and-classics-zero:${tacz_version}"
    modRuntimeOnly "maven.modrinth:timeless-and-classics-zero:${tacz_version}"
}

jar {
    manifest.attributes([
            'MixinConfigs': "${mod_id}.mixins.json"
    ])
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    def props = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version]
    inputs.properties props
    filesMatching('META-INF/mods.toml') {
        expand props
    }
}
